<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de aduelas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Calculadora</h1>
  <p class="sub">Custo da madeira pelo volume de cada peça.</p>

  <form id="formulario">
    <div>
      <label for="tipo">Tipo de peça</label>
      <select id="tipo">
        <option value="porta">Porta</option>
        <option value="janela">Janela</option>
        <option value="portaCorrer">Porta de correr</option>
      </select>
    </div>

    <div>
      <label for="quantidade">Quantidade</label>
      <input type="number" id="quantidade" min="1" step="1" value="1" required>
    </div>

    <div>
      <label for="altura">Altura (m)</label>
      <input type="number" id="altura" min="0" step="0.01" inputmode="decimal" required>
    </div>

    <div>
      <label for="largura">Largura (m)</label>
      <input type="number" id="largura" min="0" step="0.01" inputmode="decimal" required>
    </div>

    <div class="full">
      <label for="extra">Largura da aduela (cm)</label>
      <input type="number" id="extra" min="0" step="0.1" inputmode="decimal" required>
      <p class="hint" id="dica"></p>
    </div>

    <div class="full">
  <label for="alizar">Alizar (largura x espessura)</label>
  <select id="alizar">
    <option value="7x1.3">7 x 1,3 cm</option>
    <option value="5x1">5 x 1 cm</option>
    <option value="7x2">7 x 2 cm</option>
    <option value="10x2">10 x 2 cm</option>
  </select>
</div>

    <div class="full">
      <button type="submit">Calcular</button>
    </div>
  </form>

  <section id="out" aria-live="polite"></section>
</main>

<script src="index.js">
</script>
</body>
</html>
